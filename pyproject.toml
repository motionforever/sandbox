[project]
name = "quantlab"
version = "0.1.0"
description = "Python sandbox for quant research, set up to run in Claude Code cloud sessions and on a local Mac."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
